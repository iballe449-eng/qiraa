<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Apprendre à lire l'arabe et le Coran en 4 semaines.">
<meta name="theme-color" content="#1f5c46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Qirāʾa">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Qirāʾa · Lire le Coran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Fraunces:opsz,wght@9..144,500..800&family=Figtree:wght@400..700&display=swap">
<style>
:root{
  /* Layout : application mobile d'abord — colonne centrée de 720 px, barre d'onglets en bas ; leçon en plein écran avec slides ; vert profond et or, ornement d'étoile à huit branches */
  --bg:#f4eedf; --bg2:#e9dfc6; --surface:#fffaf0; --ink:#1c2a23; --muted:#5b695f; --green:#1f5c46; --green2:#2f7a5d;
  --gold:#a07a2a; --gold2:#c9a24b; --on:#fffaf0; --line:rgba(28,42,35,.14); --soft:rgba(28,42,35,.05); --ok:#2b7a4b; --bad:#b0412e;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --f-q:"Amiri Quran","Amiri","Noto Naskh Arabic",serif;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --arz:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1d17; --bg2:#0f2a21; --surface:#13332a; --ink:#f1ead6; --muted:#a6b6aa; --green:#5cc195; --green2:#86d6b2;
  --gold:#dcb75c; --gold2:#eed592; --on:#0b1d17; --line:rgba(241,234,214,.14); --soft:rgba(241,234,214,.06); --ok:#6fd39b; --bad:#ff8f7d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1d17; --bg2:#0f2a21; --surface:#13332a; --ink:#f1ead6; --muted:#a6b6aa; --green:#5cc195; --green2:#86d6b2;
  --gold:#dcb75c; --gold2:#eed592; --on:#0b1d17; --line:rgba(241,234,214,.14); --soft:rgba(241,234,214,.06); --ok:#6fd39b; --bad:#ff8f7d; color-scheme:dark}
:root.t-light{--bg:#f4eedf; --bg2:#e9dfc6; --surface:#fffaf0; --ink:#1c2a23; --muted:#5b695f; --green:#1f5c46; --green2:#2f7a5d;--gold:#a07a2a; --gold2:#c9a24b; --on:#fffaf0; --line:rgba(28,42,35,.14); --soft:rgba(28,42,35,.05); --ok:#2b7a4b; --bad:#b0412e;color-scheme:light}
:root.t-dark{--bg:#0b1d17; --bg2:#0f2a21; --surface:#13332a; --ink:#f1ead6; --muted:#a6b6aa; --green:#5cc195; --green2:#86d6b2;--gold:#dcb75c; --gold2:#eed592; --on:#0b1d17; --line:rgba(241,234,214,.14); --soft:rgba(241,234,214,.06); --ok:#6fd39b; --bad:#ff8f7d;color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23a07a2a' stroke-width='1.2'><rect x='18' y='18' width='28' height='28'/><rect x='18' y='18' width='28' height='28' transform='rotate(45 32 32)'/></g></svg>")}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.q{font-family:var(--f-q);direction:rtl;unicode-bidi:isolate}
.tr{font-style:italic;color:var(--gold);font-weight:600}

.wrap{position:relative;max-width:720px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;flex:none}
.top h1{margin:0;font:700 22px/1.1 var(--f-display);letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13.5px}
h2{font:700 clamp(24px,5vw,30px)/1.15 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font:700 19px/1.25 var(--f-display);margin:0}
.eyebrow{font:700 11.5px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px -22px rgba(0,0,0,.45)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font:700 15.5px var(--f-body);cursor:pointer;transition:transform .15s,filter .2s;text-decoration:none;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--green);color:var(--on);border-color:transparent}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1c1508;border-color:transparent}
.btn.sm{padding:8px 13px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.snd{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;color:var(--green)}
.snd svg{width:19px;height:19px}
.snd.play{animation:pulse .6s ease-in-out infinite alternate;border-color:var(--gold)}
@keyframes pulse{to{box-shadow:0 0 0 6px color-mix(in oklab,var(--gold) 25%,transparent)}}
.novoice .snd{display:none}

/* accueil */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:linear-gradient(140deg,var(--green),color-mix(in oklab,var(--green) 70%,#000));color:#f6efd9;border:0}
.hero h2{color:#fff8e4}
.hero p{margin:4px 0 0;color:#d9e6dc}
.ring{width:96px;height:96px}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:rgba(255,255,255,.18)}
.ring .fgc{stroke:#e6c46c;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:#fff8e4;font:700 20px var(--f-display)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stats span{font:600 13px var(--f-body);padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12)}
.cont{display:grid;gap:12px;margin-top:14px;border-color:color-mix(in oklab,var(--gold) 45%,transparent)}
.cont .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cont .big{font:700 46px/1 var(--f-ar);color:var(--gold)}
.week{margin-top:26px;display:grid;gap:10px}
.week-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lrow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .15s,border-color .2s}
.lrow:hover{transform:translateX(3px);border-color:var(--gold)}
.lnum{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--soft);font:700 15px var(--f-display);color:var(--green)}
.lrow.done .lnum{background:var(--green);color:var(--on)}
.lrow.next{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in oklab,var(--gold) 18%,transparent)}
.lrow b{display:block;font:650 16px/1.25 var(--f-body)}
.lrow small{color:var(--muted);font-size:13px}
.lrow .lar{font:700 22px var(--f-ar);color:var(--gold);white-space:nowrap}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px}

/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in oklab,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabs div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font:600 12px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="true"]{color:var(--green);background:var(--soft)}

/* alphabet */
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;direction:rtl;margin-top:16px}
@media (min-width:560px){.agrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.acell{display:grid;justify-items:center;gap:2px;padding:12px 4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;direction:ltr;transition:transform .15s,border-color .2s}
.acell:hover{transform:translateY(-2px);border-color:var(--gold)}
.acell .g{font:400 calc(44px*var(--arz))/1.2 var(--f-ar);color:var(--ink)}
.acell small{font-size:12px;color:var(--muted)}
.acell.known .g{color:var(--green)}

/* lecteur de leçon */
.player{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.ptop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;max-width:760px;width:100%;margin:0 auto}
.xbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;flex:none}
.pbar{flex:1;height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold2));transition:width .4s}
.ptitle{font:600 13px var(--f-body);color:var(--muted);white-space:nowrap;max-width:38%;overflow:hidden;text-overflow:ellipsis}
.pbody{overflow-y:auto;padding:8px 16px 24px}
.slide{max-width:720px;margin:0 auto;display:grid;gap:16px;animation:slin .45s cubic-bezier(.2,.8,.2,1)}
.slide.back{animation-name:slback}
@keyframes slin{from{opacity:0;transform:translateX(36px)}}
@keyframes slback{from{opacity:0;transform:translateX(-36px)}}
.slide p{margin:0}
.slide table{border-collapse:collapse;width:100%}
.slide td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.slide td.arq{font:400 32px/1.4 var(--f-q);text-align:center;width:70px;color:var(--gold)}
.arq{font-family:var(--f-q);font-size:1.4em}
.pnav{display:flex;gap:10px;justify-content:space-between;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);max-width:760px;width:100%;margin:0 auto}
.pnav .btn{flex:1;max-width:220px}

.exs{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ex .ar,.ex .q{font-size:calc(34px*var(--arz));line-height:1.6;color:var(--ink);text-align:right}
.ex .meta{display:grid;gap:0;min-width:0}
.ex .meta span:last-child{color:var(--muted);font-size:14px}
.arrowline{height:4px;border-radius:4px;background:linear-gradient(270deg,var(--gold),transparent);position:relative;overflow:hidden;margin-top:-6px}
.arrowline::after{content:"";position:absolute;top:0;bottom:0;width:30%;right:0;background:var(--gold);animation:rtl 1.8s ease-in-out infinite}
@keyframes rtl{from{right:0}to{right:100%}}

.lhero{display:grid;justify-items:center;gap:6px;padding:12px 0 4px;text-align:center}
.glyph{font:400 calc(150px*var(--arz))/1.15 var(--f-ar);color:var(--green);animation:gly .8s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 10px 30px color-mix(in oklab,var(--gold) 30%,transparent)}
@keyframes gly{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.lname{font:700 26px var(--f-display)}
.lsnd{font:600 16px var(--f-body);color:var(--muted)}
.lsnd b{color:var(--gold);font-size:20px}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;direction:rtl}
.forms div{direction:ltr;display:grid;justify-items:center;padding:10px 4px 8px;border-radius:14px;background:var(--surface);border:1px solid var(--line);animation:fup .5s both}
.forms div:nth-child(2){animation-delay:.12s}.forms div:nth-child(3){animation-delay:.24s}.forms div:nth-child(4){animation-delay:.36s}
@keyframes fup{from{opacity:0;transform:translateY(12px)}}
.forms .ar{font-size:calc(44px*var(--arz));line-height:1.4}
.forms small{color:var(--muted);font-size:12px}
.note{padding:12px 14px;border-radius:14px;background:color-mix(in oklab,var(--gold) 12%,transparent);border:1px solid color-mix(in oklab,var(--gold) 35%,transparent);font-size:15px}
.note b{color:var(--gold)}
.fam{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;direction:rtl}
.fam button{direction:ltr;display:grid;justify-items:center;padding:8px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;animation:fup .5s both}
.fam .ar{font-size:calc(56px*var(--arz));line-height:1.35;color:var(--green)}
.fam small{color:var(--muted);font-size:12.5px}
.sylgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;direction:rtl}
.syl{direction:ltr;display:grid;justify-items:center;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s}
.syl .ar{font-size:calc(40px*var(--arz));line-height:1.5}
.syl .tr{opacity:0;transition:opacity .25s;min-height:1.4em}
.syl.on .tr{opacity:1}
.syl.on{border-color:var(--gold)}

/* coran */
.ayah{display:flex;flex-wrap:wrap;gap:10px 8px;direction:rtl;justify-content:flex-start}
.word{direction:ltr;display:grid;justify-items:center;gap:0;padding:8px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:74px;transition:border-color .2s,transform .15s}
.word:hover{border-color:var(--gold);transform:translateY(-2px)}
.word .q{font-size:calc(34px*var(--arz));line-height:1.9;color:var(--ink)}
.word .tr{font-size:13.5px}
.word small{font-size:12px;color:var(--muted);text-align:center;max-width:120px;line-height:1.25}
.word.hl{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 14%,var(--surface))}
.mushaf{padding:20px 16px;border-radius:20px;background:var(--surface);border:2px solid color-mix(in oklab,var(--gold) 55%,transparent);box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px color-mix(in oklab,var(--gold) 35%,transparent)}
.mushaf .q{font-size:calc(31px*var(--arz));line-height:2.3;text-align:center;display:block}
.mushaf .bsm{font-size:calc(28px*var(--arz));color:var(--green);display:block;text-align:center;margin-bottom:6px}
.mushaf .w{cursor:pointer;border-radius:8px;transition:background .2s}
.mushaf .w:hover,.mushaf .w.hl{background:color-mix(in oklab,var(--gold) 22%,transparent)}
.mushaf .trl{display:block;text-align:center;font-style:italic;color:var(--gold);font-size:14.5px;margin:-6px 0 10px;direction:ltr}
.vnum{display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin:0 .15em;border-radius:50%;border:1.5px solid var(--gold);color:var(--gold);font:700 .5em/1 var(--f-ar);vertical-align:middle}
.snames{text-align:center;display:grid;gap:2px;margin-bottom:8px}
.snames .q{font-size:30px;color:var(--gold)}
.pop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);z-index:40;width:min(92vw,420px);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--gold);box-shadow:0 18px 40px -16px rgba(0,0,0,.5);animation:fup .3s both}
.pop .q{font-size:34px;line-height:1.7}
.pop small{display:block;color:var(--muted)}

/* exercices */
.qcard{display:grid;gap:16px}
.qq{font:650 19px/1.35 var(--f-body)}
.qar{font:400 calc(64px*var(--arz))/1.5 var(--f-ar);text-align:center;color:var(--green);direction:rtl}
.qar.q{font-family:var(--f-q)}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:600 17px var(--f-body);text-align:center;transition:transform .15s,border-color .2s,background .2s}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.opt .ar{font-size:calc(38px*var(--arz));line-height:1.3}
.opt.right{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 15%,var(--surface));animation:pop .35s}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 12%,var(--surface));animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fb{padding:12px 14px;border-radius:14px;font-weight:600}
.fb.ok{background:color-mix(in oklab,var(--ok) 14%,transparent);color:var(--ok)}
.fb.ko{background:color-mix(in oklab,var(--bad) 12%,transparent);color:var(--bad)}
.end{text-align:center;justify-items:center}
.end .score{font:800 72px/1 var(--f-display);color:var(--gold)}
.big-ar{font:400 64px/1.4 var(--f-ar);color:var(--green)}

/* réglages */
.set{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-weight:650}
.field input[type=text],.field select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.field input[type=range]{accent-color:var(--green);width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:var(--soft);border:1px solid var(--line);width:fit-content}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on)}
.muted{color:var(--muted)}
.fine{font-size:13.5px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:999px;background:var(--green);color:var(--on);font-weight:650;animation:fup .3s both;max-width:92vw}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="root">
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Navigation"><div>
    <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2zM8 7h6"/></svg>Parcours</button>

 {id:4,w:1,t:'Jīm, ḥāʾ, khāʾ',ar:'ج ح خ',newL:['ج','ح','خ'],vow:'ai',goal:'Distinguer trois lettres de même forme et deux sons de gorge.',

 {id:5,w:1,t:'Dāl, dhāl, rāʾ, zāy, wāw',ar:'د ذ ر ز و',newL:['د','ذ','ر','ز','و'],vow:'aiu',goal:'Apprendre les lettres qui ne s’attachent pas à gauche, et la voyelle « u ».',

 {id:16,w:3,t:'L’alif de liaison et le mot Allah',ar:'ٱ',vow:'aiu',words:'wa',goal:'Savoir quand un alif ne se prononce pas.',

 {id:17,w:3,t:'Les signes du mushaf Madani',ar:'ٰ ٓ ۥ',vow:'aiu',words:'ms',goal:'Reconnaître les petits signes propres au Coran.',

   {t:'text',h:'Le signe du madd : ـٓ',html:'<p>La vague au-dessus d’une lettre longue demande d’allonger plus longtemps que d’habitude : 4 à 6 temps au lieu de 2.</p>',ex:[['جَآءَ','jāʾa','il est venu']]},
   {t:'text',h:'Petit wāw et petit yāʾ : ۥ ۦ',html:'<p>Après le pronom « hu / hi », un petit wāw ou un petit yāʾ indique qu’on allonge : « hū », « hī ».</p>',ex:[['لَهُۥ','lahū','à lui'],['بِهِۦ','bihī','par lui']]},

   {t:'text',h:'Les marques de pause',html:'<p>Au-dessus du texte, de petits signes indiquent où s’arrêter :</p><table><tr><td class="arq">ۘ</td><td>arrêt obligatoire</td></tr><tr><td class="arq">ۗ</td><td>arrêt préférable</td></tr><tr><td class="arq">ۚ</td><td>arrêt permis</td></tr><tr><td class="arq">ۖ</td><td>continuer est préférable</td></tr><tr><td class="arq">ۙ</td><td>ne pas s’arrêter ici</td></tr><tr><td class="arq">ۛ … ۛ</td><td>s’arrêter à l’un des deux, pas aux deux</td></tr></table><p>La fin de chaque verset est marquée par un cercle numéroté ۝.</p>'},

/* ================= outils ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem('qiraa:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('qiraa:'+k,JSON.stringify(v))}catch(e){}}};
const ICON_SND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)}

/* ================= état ================= */
const P=Object.assign({name:'Ibrahim',done:{},streak:{last:'',n:0},voice:'',rate:.75,arz:1,theme:'auto',trl:true},store.get('p',{}));
function save(){store.set('p',P)}
function applyPrefs(){const R=document.documentElement;R.classList.toggle('t-light',P.theme==='light');R.classList.toggle('t-dark',P.theme==='dark');R.style.setProperty('--arz',P.arz)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function bumpStreak(){const t=today();if(P.streak.last===t)return;const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');P.streak.n=P.streak.last===ys?P.streak.n+1:1;P.streak.last=t;save()}

function speak(text,btn){
 if(!('speechSynthesis' in window)||!VOICES.length){toast('Aucune voix arabe sur cet appareil : voir Réglages.');return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=VOICES.find(x=>x.voiceURI===P.voice)||VOICES.find(x=>/SA|EG/i.test(x.lang))||VOICES[0];u.voice=v;u.lang=v.lang;u.rate=P.rate;
 if(btn){btn.classList.add('play');u.onend=u.onerror=()=>btn.classList.remove('play')}speechSynthesis.speak(u)}
function sndBtn(text,label){return `<button type="button" class="snd" data-say="${esc(text)}" aria-label="${esc(label||'Écouter')}">${ICON_SND}</button>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say,b)}});

/* ================= lettres ================= */
const forms=l=>{const c=l.c;if(l.iso)return [c,c,c,c];return l.nc?[c,c,TT+c,TT+c]:[c,c+TT,TT+c+TT,TT+c]};
const FN=['seule','début','milieu','fin'];
const learned=upto=>LS.filter(l=>l.id<=upto&&l.newL).flatMap(l=>l.newL);
const SNDL={'ا':'ā'};
function sib(c){const f=FAMILY.find(f=>f.includes(c));return f?f.filter(x=>x!==c):[]}

/* ================= rendu des blocs ================= */
function exList(ex,q){return `<div class="exs">${ex.map(([a,t,f])=>`<div class="ex">${sndBtn(a)}<div class="meta"><span class="tr">${esc(t)}</span><span>${esc(f||'')}</span></div><span class="${q?'q':'ar'}" lang="ar">${a}</span></div>`).join('')}</div>`}
function formsBlock(c){const l=LBY[c];const f=forms(l);return `<div class="forms">${f.map((x,i)=>`<div><span class="ar" lang="ar">${x}</span><small>${FN[i]}</small></div>`).join('')}</div>`}
function famBlock(arr){return `<div class="fam">${arr.map((c,i)=>{const l=LBY[c];return `<button type="button" data-say="${l.an}" style="animation-delay:${i*.1}s"><span class="ar" lang="ar">${c}</span><small>${l.n} · ${l.s}</small></button>`}).join('')}</div>`}
const isQ=s=>/[ٱۥۦٰ۟ۢٓ]/.test(s);
function letterSlide(c){const l=LBY[c];const f=forms(l);
 return `<div class="lhero"><div class="glyph ar" lang="ar">${c}</div><div class="lname">${l.n} <span class="ar" lang="ar" style="color:var(--gold);font-size:.9em">${l.an}</span></div><div class="lsnd">son : <b>${l.s}</b></div>
 <div style="display:flex;gap:8px">${sndBtn(l.an,'Écouter le nom')}${l.c!=='ا'&&l.c!=='ء'?`<button class="btn sm" type="button" data-say="${c}${F}">son « ${l.s}a »</button>`:''}</div></div>
 <p>${l.tip}</p>${formsBlock(c)}
 ${l.nc&&!l.iso?'<div class="note"><b>Ne s’attache pas à gauche :</b> la lettre suivante repart en forme « début ».</div>':''}${l.heavy?'<div class="note"><b>Lettre lourde :</b> bouche pleine, son grave.</div>':''}
 <h3>Exemples</h3>${exList(l.ex)}<p class="fine">Les exemples contiennent parfois des lettres que tu n’as pas encore vues : concentre-toi sur la lettre du jour.</p>`}
function sylSlide(letters,vow){const items=[];for(const c of letters){if(c==='ا')continue;const base=c==='ء'?'أ':c;for(const v of vow){if(c==='ء'&&v==='i')items.push(['إ'+K,'ʾi']);else items.push([base+VOW[v][0],(LBY[c].s)+VOW[v][1]])}}
 return `<p>Touche chaque syllabe : lis-la d’abord dans ta tête, puis vérifie la lecture et écoute.</p><div class="sylgrid">${items.map(([a,t])=>`<button type="button" class="syl" data-sy="${a}"><span class="ar" lang="ar">${a}</span><span class="tr">${t}</span></button>`).join('')}</div>`}
function drillSlide(key){const L=W[key];return `<p>Lis chaque mot à voix haute, puis touche-le pour vérifier.</p><div class="sylgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${L.map(([a,t,f])=>`<button type="button" class="syl" data-sy="${a}"><span class="${isQ(a)?'q':'ar'}" lang="ar" style="font-size:calc(32px*var(--arz))">${a}</span><span class="tr">${t}</span><small class="muted tr" style="font-style:normal;color:var(--muted);font-weight:500">${f}</small></button>`).join('')}</div>`}
function ayahBlock(s,i){const A=s.ayat[i];const full=A.map(w=>w[0]).join(' ');
 return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="eyebrow">${s.n} · verset ${i+1}</span>${sndBtn(full,'Écouter le verset')}</div>
 <div class="ayah">${A.map(([a,t,f])=>`<button type="button" class="word" data-w="${esc(a)}"><span class="q" lang="ar">${a}</span><span class="tr">${t}</span><small>${f}</small></button>`).join('')}</div>
 <div class="note"><b>Lecture continue :</b> <span class="tr">${A.map(w=>w[1]).join(' ')}</span></div>`}
function mushafBlock(s,trl){const bsm=s.id!=='fatiha'?`<span class="q bsm" lang="ar">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</span>`:'';const ind=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
 return `<div class="mushaf" data-s="${s.id}"><div class="snames"><span class="ar" lang="ar" style="font-size:28px;color:var(--gold)">سورة ${s.ar}</span><span class="fine">${s.n} · ${s.fr} · sourate ${s.num}</span></div>${bsm}${s.ayat.map((A,i)=>`<span class="q" lang="ar">${A.map((w,j)=>`<span class="w" data-a="${i}" data-j="${j}">${w[0]}</span>`).join(' ')} <span class="vnum">${ind(i+1)}</span></span>${trl?`<span class="trl">${A.map(w=>w[1]).join(' ')}</span>`:''}`).join('')}</div>`}

/* ================= construction des slides ================= */
function slidesFor(L){
 if(L.surah){const ids=[].concat(L.surah);const out=[{h:L.t,html:`<p>${L.goal}</p><div class="note"><b>Méthode :</b> pour chaque verset, lis d’abord seul, puis touche les mots pour vérifier. Termine par la lecture complète.</div><p class="fine">La voix de synthèse ne respecte pas toutes les règles de récitation : écoute aussi un récitateur et imite-le.</p>`}];
  for(const id of ids){const s=SBY[id];s.ayat.forEach((_,i)=>out.push({h:`${s.n}, verset ${i+1}`,html:ayahBlock(s,i)}));out.push({h:`${s.n} en entier`,html:mushafBlock(s,true)+'<p class="fine">Touche un mot du texte pour voir sa lecture et son sens.</p>'})}return out}
 const out=[];const intro={h:L.t,html:`<div class="lhero"><div class="big-ar ar" lang="ar">${L.ar}</div></div><p>${L.goal}</p>`};out.push(intro);
 if(L.slides){for(const s of L.slides){if(s.t==='drill')out.push({h:s.h,html:drillSlide(s.items)});else out.push(textSlide(s))}return out}
 (L.pre||[]).forEach(s=>out.push(textSlide(s)));
 for(const c of L.newL)out.push({h:`La lettre ${LBY[c].n}`,html:letterSlide(c)});
 out.push({h:'Les syllabes',html:sylSlide(L.newL,L.vow)});
 (L.post||[]).forEach(s=>out.push(textSlide(s)));
 const all=learned(L.id);out.push({h:'Ce que tu sais lire',html:`<p>Tu connais maintenant ${all.length} lettre${all.length>1?'s':''}. Touche-les pour les réécouter.</p>${famBlock(all)}`});
 return out}
function textSlide(s){let h=s.html||'';if(s.ex)h+=exList(s.ex,s.ex.some(e=>isQ(e[0])));if(s.arrow)h+='<div class="arrowline" aria-hidden="true"></div>';if(s.forms)h+=formsBlock(s.forms);if(s.family)h+=s.mid?`<div class="forms" style="grid-template-columns:repeat(${s.family.length},minmax(0,1fr))">${s.family.map(c=>`<div><span class="ar" lang="ar">${TT+c+TT}</span><small>${LBY[c].n}</small></div>`).join('')}</div>`:famBlock(s.family);return {h:s.h,html:h}}

/* ================= exercices ================= */
function opt(label,ok,ar){return {label,ok,ar}}
function qLetterSound(c){const l=LBY[c];const pool=shuffle([...sib(c),...LET.map(x=>x.c)]).filter(x=>x!==c&&x!=='ا'&&x!=='ء');const ds=[...new Set(pool)].slice(0,3);
 return {q:'Quel est le son de cette lettre ?',ar:c,o:shuffle([opt(`${l.s} (${l.n})`,1),...ds.map(d=>opt(`${LBY[d].s} (${LBY[d].n})`,0))])}}
function qSoundLetter(c,pool){const l=LBY[c];const ds=shuffle([...new Set([...sib(c),...pool])].filter(x=>x!==c&&x!=='ء')).slice(0,3);return {q:`Quelle lettre se lit « ${l.s} » (${l.n}) ?`,say:l.an,o:shuffle([opt(c,1,1),...ds.map(d=>opt(d,0,1))]),grid:1}}
function qForm(c,pool){const l=LBY[c];const f=forms(l);const i=1+Math.floor(Math.random()*3);const ds=shuffle([...new Set([...sib(c),...pool])].filter(x=>x!==c&&x!=='ء')).slice(0,3);return {q:`À quelle lettre correspond cette forme (${FN[i]} de mot) ?`,ar:f[i],o:shuffle([opt(c,1,1),...ds.map(d=>opt(d,0,1))]),grid:1}}
function qSyl(c,vow,pool){if(c==='ا'||c==='ء')c=pick(pool.filter(x=>x!=='ا'&&x!=='ء'));const v=pick([...vow]);const ok=LBY[c].s+VOW[v][1];const cand=new Set();for(const vv of vow)cand.add(LBY[c].s+VOW[vv][1]);for(const s of shuffle(sib(c).concat(pool)))if(s!=='ا'&&s!=='ء')cand.add(LBY[s].s+VOW[v][1]);const ds=[...cand].filter(x=>x!==ok).slice(0,3);return {q:'Comment se lit cette syllabe ?',ar:c+VOW[v][0],say:c+VOW[v][0],o:shuffle([opt(ok,1),...ds.map(d=>opt(d,0))])}}
function qWord(list){const w=pick(list);const ds=shuffle(list.filter(x=>x!==w)).slice(0,3);return {q:'Comment se lit ce mot ?',ar:w[0],say:w[0],qf:isQ(w[0]),o:shuffle([opt(w[1],1),...ds.map(d=>opt(d[1],0))]),sub:w[2]}}
function qListen(c,vow){const v=pick([...vow]);const s=c+VOW[v][0];const ds=shuffle(sib(c).concat(LET.map(x=>x.c)).filter(x=>x!==c&&x!=='ا'&&x!=='ء')).slice(0,3);return {q:'Écoute et choisis la syllabe entendue.',listen:s,o:shuffle([opt(s,1,1),...ds.map(d=>opt(d+VOW[v][0],0,1))]),grid:1}}
function quizFor(L){
 if(L.quiz&&L.quiz.custom)return shuffle(L.quiz.custom).map(c=>({q:c.q,ar:c.ar,qf:c.ar&&isQ(c.ar),o:shuffle(c.o.map((t,i)=>opt(t,i===0)))}));
 if(L.surah){const ws=[].concat(L.surah).flatMap(id=>SBY[id].ayat.flat());const uniq=[...new Map(ws.map(w=>[w[1],w])).values()];const Q=[];
  const um=[...new Map(uniq.map(w=>[w[2],w])).values()];for(let k=0;k<10;k++){const w=pick(k%2?um:uniq);if(k%2){const ds=shuffle(um.filter(x=>x[2]!==w[2])).slice(0,3);Q.push({q:'Que signifie ce mot ?',ar:w[0],qf:1,say:w[0],o:shuffle([opt(w[2],1),...ds.map(d=>opt(d[2],0))])})}else{const ds=shuffle(uniq.filter(x=>x[1]!==w[1])).slice(0,3);Q.push({q:'Comment se lit ce mot ?',ar:w[0],qf:1,say:w[0],o:shuffle([opt(w[1],1),...ds.map(d=>opt(d[1],0))])})}}return Q}
 if(L.words){const list=W[L.words];const Q=[];for(let k=0;k<6;k++)Q.push(qWord(list));const pool=learned(9).filter(c=>c!=='ا'&&c!=='ء');for(let k=0;k<4;k++)Q.push(qSyl(pick(pool),'aiu',pool));return shuffle(Q)}
 const neu=L.newL,pool=learned(L.id);const Q=[];const nl=neu.filter(c=>c!=='ا'&&c!=='ء');
 for(const c of neu){Q.push(c==='ا'?{q:'Quel est le rôle de l’alif ?',ar:'بَا',o:shuffle([opt('Il allonge le « a » : bā',1),opt('Il se lit « i »',0),opt('Il se lit « b »',0)])}:c==='ء'?{q:'Comment se prononce la hamza ?',ar:'ء',o:shuffle([opt('Un petit arrêt de la voix',1),opt('Comme un « h » soufflé',0),opt('Comme un « r » roulé',0)])}:qLetterSound(c))}
 for(const c of nl)Q.push(qSoundLetter(c,pool));
 while(Q.length<11){const c=pick(nl.length?nl:pool);const r=Math.random();Q.push(r<.35?qForm(c,pool):r<.75||!VOICES.length?qSyl(c,L.vow,pool.filter(x=>x!=='ا')):qListen(c,L.vow))}
 return shuffle(Q).slice(0,12)}
function reviewQuiz(){const maxId=Math.max(0,...Object.keys(P.done).map(Number));const pool=learned(Math.max(2,maxId)).filter(c=>c!=='ا'&&c!=='ء');const Q=[];const lists=Object.keys(W).filter((k,i)=>LS.some(l=>l.words===k&&l.id<=maxId));
 for(let k=0;k<10;k++){const r=Math.random();if(lists.length&&r<.35)Q.push(qWord(W[pick(lists)]));else{const c=pick(pool);Q.push(r<.55?qLetterSound(c):r<.75?qForm(c,pool):qSyl(c,maxId>=5?'aiu':maxId>=3?'ai':'a',pool))}}return Q}

/* ================= lecteur ================= */
let PL=null;
function openLesson(id,review){
 const L=review?{id:0,t:'Révision rapide'}:LS.find(l=>l.id===id);
 const slides=review?[]:slidesFor(L);const quiz=review?reviewQuiz():quizFor(L);
 PL={L,slides,quiz,i:0,qi:0,score:0,phase:review?'quiz':'slides',answered:false,review};
 const el=document.createElement('div');el.className='player';el.id='player';el.innerHTML=`<div class="ptop"><button class="xbtn" type="button" id="pClose" aria-label="Quitter la leçon">×</button><div class="pbar"><i id="pBar"></i></div><span class="ptitle">${esc(L.t)}</span></div><div class="pbody" id="pBody"></div><div class="pnav" id="pNav"></div>`;
 document.body.append(el);document.body.style.overflow='hidden';$('#pClose').onclick=closeLesson;bumpStreak();drawPlayer(1)}
function closeLesson(){speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();const p=$('#player');if(p)p.remove();document.body.style.overflow='';PL=null;render()}
function drawPlayer(dir){
 const B=$('#pBody'),N=$('#pNav');const total=PL.slides.length+PL.quiz.length;
 if(PL.phase==='slides'){const s=PL.slides[PL.i];$('#pBar').style.width=((PL.i+1)/total*100)+'%';
  B.innerHTML=`<section class="slide${dir<0?' back':''}"><p class="eyebrow">${PL.L.id?`Leçon ${PL.L.id} · `:''}${PL.i+1} / ${PL.slides.length}</p><h2>${s.h}</h2>${s.html}</section>`;B.scrollTop=0;
  N.innerHTML=`<button class="btn" type="button" id="pPrev" ${PL.i===0?'disabled':''}>← Retour</button><button class="btn pri" type="button" id="pNext">${PL.i===PL.slides.length-1?'Exercices →':'Suivant →'}</button>`;
  $('#pPrev').onclick=()=>{if(PL.i>0){PL.i--;drawPlayer(-1)}};$('#pNext').onclick=()=>{if(PL.i<PL.slides.length-1){PL.i++;drawPlayer(1)}else{PL.phase='quiz';drawPlayer(1)}};
  bindSlide(B);return}
 if(PL.phase==='quiz'){const Q=PL.quiz[PL.qi];PL.answered=false;$('#pBar').style.width=((PL.slides.length+PL.qi+1)/total*100)+'%';
  B.innerHTML=`<section class="slide qcard"><p class="eyebrow">Exercice ${PL.qi+1} / ${PL.quiz.length}</p><div class="qq">${esc(Q.q)}</div>
  ${Q.ar?`<div class="qar ${Q.qf?'q':''}" lang="ar">${Q.ar}</div>`:''}${Q.sub&&false?'':''}
  ${Q.listen?`<div style="display:grid;place-items:center"><button class="btn gold" type="button" id="lsn">${ICON_SND} Écouter</button></div>`:Q.say?`<div style="display:grid;place-items:center">${sndBtn(Q.say)}</div>`:''}
  <div class="opts ${Q.grid?'grid':''}">${Q.o.map((o,k)=>`<button type="button" class="opt" data-k="${k}">${o.ar?`<span class="ar" lang="ar">${o.label}</span>`:esc(o.label)}</button>`).join('')}</div><div id="fb"></div></section>`;
  N.innerHTML=`<span></span><button class="btn pri" type="button" id="pNext" disabled>Continuer →</button>`;
  if(Q.listen){const b=$('#lsn');b.onclick=()=>speak(Q.listen,b);setTimeout(()=>speak(Q.listen,b),350)}
  $$('.opt',B).forEach(b=>b.onclick=()=>answer(b,Q));$('#pNext').onclick=()=>{PL.qi++;if(PL.qi>=PL.quiz.length){PL.phase='end'}drawPlayer(1)};return}
 // fin
 const n=PL.quiz.length,pct=Math.round(PL.score/n*100);$('#pBar').style.width='100%';
 if(!PL.review&&PL.L.id){const prev=P.done[PL.L.id]||0;P.done[PL.L.id]=Math.max(prev,pct);save()}
 const stars=pct>=90?3:pct>=70?2:pct>=50?1:0;const next=LS.find(l=>l.id===PL.L.id+1);
 B.innerHTML=`<section class="slide card end" style="display:grid;gap:14px"><p class="eyebrow">${PL.review?'Révision terminée':'Leçon terminée'}</p><div class="score">${pct} %</div><div class="stars" style="font-size:26px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
 <p>${PL.score} bonne${PL.score>1?'s':''} réponse${PL.score>1?'s':''} sur ${n}. ${pct>=70?'Très bien, tu peux passer à la suite.':'Refais les exercices une fois avant de continuer : la répétition, c’est la clé.'}</p>
 ${PL.L.id===22&&pct>=70?'<div class="note"><b>Félicitations !</b> Tu as terminé le parcours. Continue à lire chaque jour quelques versets dans l’onglet Coran.</div>':''}</section>`;
 N.innerHTML=`<button class="btn" type="button" id="pAgain">Refaire</button>${next&&!PL.review?`<button class="btn pri" type="button" id="pNextL">Leçon ${next.id} →</button>`:`<button class="btn pri" type="button" id="pDone">Terminer</button>`}`;
 $('#pAgain').onclick=()=>{const id=PL.L.id,rv=PL.review;closeLesson();openLesson(id,rv)};const nl=$('#pNextL');if(nl)nl.onclick=()=>{closeLesson();openLesson(next.id)};const d=$('#pDone');if(d)d.onclick=closeLesson;
 if(pct>=70)celebrate()}
function answer(b,Q){if(PL.answered)return;PL.answered=true;const o=Q.o[+b.dataset.k];$$('.opt').forEach((x,k)=>{x.disabled=true;if(Q.o[k].ok)x.classList.add('right')});
 if(o.ok){PL.score++}else b.classList.add('wrong');const good=Q.o.find(x=>x.ok);
 $('#fb').innerHTML=`<div class="fb ${o.ok?'ok':'ko'}">${o.ok?'Bonne réponse.':'Pas tout à fait. La bonne réponse : '+(good.ar?`<span class="ar" lang="ar" style="font-size:1.6em">${good.label}</span>`:esc(good.label))}${Q.sub?` · <span style="font-weight:500">${esc(Q.sub)}</span>`:''}</div>`;
 $('#pNext').disabled=false;$('#pNext').focus({preventScroll:true});if(Q.say&&o.ok&&VOICES.length)speak(Q.say)}
function bindSlide(B){$$('.syl',B).forEach(b=>b.onclick=()=>{b.classList.add('on');speak(b.dataset.sy,null)});
 $$('.word',B).forEach(b=>b.onclick=()=>{$$('.word',B).forEach(x=>x.classList.remove('hl'));b.classList.add('hl');speak(b.dataset.w,null)});bindMushaf(B)}
function bindMushaf(root){$$('.mushaf .w',root).forEach(w=>w.onclick=()=>{const s=SBY[w.closest('.mushaf').dataset.s];if(!s)return;const W_=s.ayat[+w.dataset.a][+w.dataset.j];$$('.mushaf .w',root).forEach(x=>x.classList.remove('hl'));w.classList.add('hl');showPop(W_)})}
function curSurah(root){const m=root.querySelector('.mushaf');if(!m)return null;const t=m.querySelector('.snames .fine').textContent;return SUR.find(s=>t.startsWith(s.n))}
function showPop([a,t,f]){let p=$('#pop');if(p)p.remove();p=document.createElement('div');p.className='pop';p.id='pop';p.innerHTML=`<span class="q" lang="ar">${a}</span><div><span class="tr">${esc(t)}</span><small>${esc(f)}</small></div>${sndBtn(a)}`;document.body.append(p);speak(a,null);clearTimeout(showPop.t);showPop.t=setTimeout(()=>p.remove(),6000)}
function celebrate(){if(REDUCED)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70';const d=Math.min(2,devicePixelRatio||1);c.width=innerWidth*d;c.height=innerHeight*d;document.body.append(c);const x=c.getContext('2d');x.scale(d,d);
 const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue('--gold').trim(),cs.getPropertyValue('--gold2').trim(),cs.getPropertyValue('--green').trim()];
 const ps=[...Array(70)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,r:Math.random()*6,s:4+Math.random()*5,c:pick(cols)}));const t0=performance.now();
 const star=(s)=>{x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4;x.lineTo(Math.cos(a)*s,Math.sin(a)*s);x.lineTo(Math.cos(a+Math.PI/8)*s*.45,Math.sin(a+Math.PI/8)*s*.45)}x.closePath();x.fill()};
 const f=n=>{const w=(n-t0)/1400;x.clearRect(0,0,innerWidth,innerHeight);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.r+=.05;x.save();x.globalAlpha=Math.max(0,1-w);x.fillStyle=p.c;x.translate(p.x,p.y);x.rotate(p.r);star(p.s);x.restore()}if(w<1)requestAnimationFrame(f);else c.remove()};requestAnimationFrame(f)}

/* ================= vues ================= */
let cur='home';
const V=$('#view');
function nextLesson(){return LS.find(l=>!(P.done[l.id]>=50))||LS[LS.length-1]}
function render(){
 $$('.tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===cur)));
 if(cur==='home')return home();if(cur==='abc')return abc();if(cur==='quran')return quran();if(cur==='set')return settings()}
const LOGO='<svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="9" width="30" height="30" rx="3" fill="var(--green)"/><rect x="9" y="9" width="30" height="30" rx="3" fill="var(--green)" transform="rotate(45 24 24)"/><circle cx="24" cy="24" r="10" fill="none" stroke="var(--gold2)" stroke-width="2"/><text x="24" y="30" text-anchor="middle" font-family="Amiri,serif" font-size="17" fill="var(--gold2)">ق</text></svg>';
function home(){
 const nd=Object.values(P.done).filter(v=>v>=50).length,tot=LS.length,C=2*Math.PI*40;const nx=nextLesson();const hr=new Date().getHours();
 V.innerHTML=`<div class="top">${LOGO}<div><h1>Qirāʾa</h1><p>Lire le Coran en 4 semaines</p></div></div>
 <section class="card hero"><svg class="ring" viewBox="0 0 96 96"><circle class="bgc" cx="48" cy="48" r="40"/><circle class="fgc" cx="48" cy="48" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 48 48)" id="ringFg"/><text x="48" y="55" text-anchor="middle">${nd}/${tot}</text></svg>
 <div><p class="eyebrow" style="color:#e6c46c">${hr<12?'Bonjour':hr<18?'Bon après-midi':'Bonsoir'}${P.name?', '+esc(P.name):''}</p><h2>As-salāmu ʿalaykum</h2><p>${nd===0?'Ton parcours commence aujourd’hui.':nd>=tot?'Parcours terminé, bravo.':`${nd} leçon${nd>1?'s':''} terminée${nd>1?'s':''} sur ${tot}.`}</p>
 <div class="stats"><span>🔥 ${P.streak.n||0} jour${(P.streak.n||0)>1?'s':''} de suite</span><span>≈ 25 min / jour</span></div></div></section>
 <section class="card cont"><div class="row"><div><p class="eyebrow">Leçon du jour · semaine ${nx.w}</p><h3>${nx.id}. ${esc(nx.t)}</h3><p class="muted" style="margin:4px 0 0">${esc(nx.goal)}</p></div><span class="big ar" lang="ar">${nx.ar}</span></div>
 <div class="row"><button class="btn pri" type="button" data-open="${nx.id}">${P.done[nx.id]?'Refaire':'Commencer'} la leçon →</button>${nd?'<button class="btn" type="button" id="rev">Révision rapide</button>':''}</div></section>
 ${WEEKS.map((wk,i)=>`<section class="week"><div class="week-h"><h3>Semaine ${i+1}</h3><span class="fine">${esc(wk)}</span></div>${LS.filter(l=>l.w===i+1).map(l=>{const sc=P.done[l.id];const st=sc>=90?3:sc>=70?2:sc>=50?1:0;return `<button type="button" class="lrow${sc>=50?' done':''}${l===nx?' next':''}" data-open="${l.id}"><span class="lnum">${sc>=50?'✓':l.id}</span><span><b>${esc(l.t)}</b><small>${sc!==undefined?`<span class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span> ${sc} %`:esc(l.goal)}</small></span><span class="lar" lang="ar">${l.ar}</span></button>`}).join('')}</section>`).join('')}`;
 requestAnimationFrame(()=>{const r=$('#ringFg');if(r)r.style.strokeDashoffset=C*(1-nd/tot)});
 $$('[data-open]',V).forEach(b=>b.onclick=()=>openLesson(+b.dataset.open));const rv=$('#rev');if(rv)rv.onclick=()=>openLesson(0,true)}
function abc(){const known=new Set(learned(Math.max(0,...Object.keys(P.done).filter(k=>P.done[k]>=50).map(Number))));
 V.innerHTML=`<div class="top">${LOGO}<div><h1>Alphabet</h1><p>28 lettres et la hamza · de droite à gauche</p></div></div><p class="muted">Touche une lettre pour voir ses formes, sa prononciation et des exemples. En vert : les lettres déjà étudiées.</p>
 <div class="agrid">${LET.map(l=>`<button type="button" class="acell${known.has(l.c)?' known':''}" data-l="${l.c}"><span class="g" lang="ar">${l.c}</span><small>${l.n} · ${l.s}</small></button>`).join('')}</div>`;
 $$('.acell',V).forEach(b=>b.onclick=()=>{const c=b.dataset.l;const el=document.createElement('div');el.className='player';el.id='player';el.innerHTML=`<div class="ptop"><button class="xbtn" type="button" aria-label="Fermer">×</button><span class="ptitle" style="max-width:none">Alphabet · ${LBY[c].n}</span></div><div class="pbody"><section class="slide">${letterSlide(c)}</section></div><div class="pnav"><button class="btn" type="button" data-d="-1">← Précédente</button><button class="btn pri" type="button" data-d="1">Suivante →</button></div>`;
  document.body.append(el);document.body.style.overflow='hidden';$('.xbtn',el).onclick=()=>{el.remove();document.body.style.overflow=''};
  $$('[data-d]',el).forEach(x=>x.onclick=()=>{const i=LET.findIndex(l=>l.c===c);const n=LET[(i+ +x.dataset.d+LET.length)%LET.length].c;el.remove();document.body.style.overflow='';$(`.acell[data-l="${n}"]`).click()})})}
let qsel=null;
function quran(){
 if(!qsel){V.innerHTML=`<div class="top">${LOGO}<div><h1>Coran</h1><p>Lecture mot à mot · rasm uthmani (Madani)</p></div></div>
 <div style="display:grid;gap:10px">${SUR.map(s=>`<button type="button" class="lrow" data-s="${s.id}"><span class="lnum">${s.num}</span><span><b>${s.n}</b><small>${s.fr} · ${s.ayat.length} versets</small></span><span class="lar q" lang="ar">${s.ar}</span></button>`).join('')}</div>
 <p class="fine" style="margin-top:16px">Pour la vraie récitation, écoute un récitateur (par exemple sur <a href="https://quran.com" target="_blank" rel="noopener" style="color:var(--gold)">quran.com</a>) et répète après lui. La voix de l’app est une voix de synthèse.</p>`;
  $$('[data-s]',V).forEach(b=>b.onclick=()=>{qsel=b.dataset.s;quran();scrollTo(0,0)});return}
 const s=SBY[qsel];V.innerHTML=`<div class="top"><button class="xbtn" type="button" id="qBack" aria-label="Retour">←</button><div><h1>${s.n}</h1><p>${s.fr}</p></div></div>
 <div class="seg" role="group" aria-label="Transcription" style="margin-bottom:14px"><button type="button" data-t="1" aria-pressed="${P.trl}">Avec transcription</button><button type="button" data-t="0" aria-pressed="${!P.trl}">Arabe seul</button></div>
 <div data-s="${s.id}">${mushafBlock(s,P.trl)}</div><p class="fine" style="margin-top:12px">Touche un mot pour l’entendre et voir son sens.</p>
 <h3 style="margin-top:22px">Verset par verset</h3><div style="display:grid;gap:18px;margin-top:10px">${s.ayat.map((_,i)=>`<div class="card" style="display:grid;gap:12px">${ayahBlock(s,i)}</div>`).join('')}</div>`;
 $('#qBack').onclick=()=>{qsel=null;quran()};$$('[data-t]',V).forEach(b=>b.onclick=()=>{P.trl=b.dataset.t==='1';save();quran()});bindSlide(V)}
function settings(){
 V.innerHTML=`<div class="top">${LOGO}<div><h1>Réglages</h1><p>Personnalise ton application</p></div></div><div class="set">
 <section class="card field"><label for="nm">Ton prénom</label><input type="text" id="nm" value="${esc(P.name)}" autocomplete="given-name"></section>
 <section class="card field"><label for="vc">Voix arabe</label>${VOICES.length?`<select id="vc">${VOICES.map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===P.voice?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select>
  <label for="rt">Vitesse : <span id="rtv">${P.rate}</span></label><input type="range" id="rt" min="0.5" max="1.1" step="0.05" value="${P.rate}">
  <div><button class="btn sm" type="button" data-say="بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ">${ICON_SND} Tester la voix</button></div>`
  :`<p class="muted">Aucune voix arabe n’est installée sur cet appareil. Sur Android : Paramètres → Système → Langues → Synthèse vocale → moteur Google → installer « Arabe ». Sur iPhone : Réglages → Accessibilité → Contenu énoncé → Voix → Arabe. Puis rouvre l’app.</p>`}</section>
 <section class="card field"><label>Taille du texte arabe</label><div class="seg" role="group" aria-label="Taille du texte arabe">${[['Normal',1],['Grand',1.2],['Très grand',1.4]].map(([l,v])=>`<button type="button" data-z="${v}" aria-pressed="${P.arz==v}">${l}</button>`).join('')}</div><p class="ar" lang="ar" style="font-size:calc(40px*var(--arz));margin:0">بِسْمِ ٱللَّهِ</p></section>
 <section class="card field"><label>Thème</label><div class="seg" role="group" aria-label="Thème">${[['Automatique','auto'],['Clair','light'],['Sombre','dark']].map(([l,v])=>`<button type="button" data-th="${v}" aria-pressed="${P.theme===v}">${l}</button>`).join('')}</div></section>
 <section class="card field"><label>Progression</label><p class="fine" style="margin:0">${Object.keys(P.done).length} leçon(s) commencée(s) · série de ${P.streak.n||0} jour(s). La progression est enregistrée sur cet appareil.</p><div><button class="btn sm" type="button" id="rs">Remettre à zéro</button></div><p class="fine" id="rsc" hidden>Touche encore une fois pour confirmer.</p></section>
 <p class="fine">Contenu : alphabet, voyelles, signes du mushaf Madani et règles de base du tajwīd selon la lecture de Ḥafṣ ʿan ʿĀṣim. Texte coranique en rasm uthmani.</p></div>`;
 $('#nm').oninput=e=>{P.name=e.target.value.trim().slice(0,30);save()};
 const vc=$('#vc');if(vc)vc.onchange=()=>{P.voice=vc.value;save()};const rt=$('#rt');if(rt)rt.oninput=()=>{P.rate=+rt.value;$('#rtv').textContent=P.rate;save()};
 $$('[data-z]',V).forEach(b=>b.onclick=()=>{P.arz=+b.dataset.z;save();applyPrefs();settings()});$$('[data-th]',V).forEach(b=>b.onclick=()=>{P.theme=b.dataset.th;save();applyPrefs();settings()});
 let arm=false;$('#rs').onclick=()=>{if(!arm){arm=true;$('#rsc').hidden=false;return}P.done={};P.streak={last:'',n:0};save();toast('Progression remise à zéro');settings()}}

/* ================= démarrage ================= */
$$('.tabs [data-tab]').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;if(cur==='quran')qsel=null;render();scrollTo(0,0)});
document.addEventListener('keydown',e=>{if(!PL||e.target.closest('input,select'))return;if(e.key==='Escape')closeLesson();if(PL.phase==='slides'){if(e.key==='ArrowRight'){const b=$('#pNext');b&&b.click()}if(e.key==='ArrowLeft'){const b=$('#pPrev');b&&!b.disabled&&b.click()}}else if(PL.phase==='quiz'&&!PL.answered&&/^[1-4]$/.test(e.key)){const b=$$('.opt')[+e.key-1];b&&b.click()}});
applyPrefs();loadVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
const h=(location.hash||'').slice(1);if(['abc','quran','set'].includes(h))cur=h;render();

if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
</html>
